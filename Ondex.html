<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PRFM · Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #f0f0ee; font-family: sans-serif; display: flex; flex-direction: column; height: 100dvh; }

  #log {
    background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
    padding: 10px 14px; font-family: monospace; font-size: 11px;
    color: #00C9B1; min-height: 36px; flex-shrink: 0;
  }

  #cam-wrap { position: relative; width: 100%; height: 200px; background: #000; flex-shrink: 0; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }

  #scan-btn {
    margin: 12px 16px; padding: 18px; background: #00C9B1; color: #000;
    border: none; border-radius: 12px; font-size: 16px; font-weight: bold;
    width: calc(100% - 32px); cursor: pointer;
  }
  #scan-btn:disabled { background: #333; color: #555; }

  #result {
    margin: 0 16px; padding: 16px; background: #071a18;
    border: 2px solid #00C9B1; border-radius: 12px; display: none;
  }
  #result .code { font-family: monospace; font-size: 20px; font-weight: bold; margin-bottom: 12px; word-break: break-all; }
  #result .btns { display: flex; gap: 10px; }
  #result .btns button { flex: 1; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; }
  #result .btns .wrong { background: none; border: 2px solid #E63946; color: #E63946; }
  #result .btns .add   { background: #00C9B1; color: #000; }

  #tally { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #1a1a1a; border-radius: 10px; margin-bottom: 8px; font-family: monospace; font-size: 14px; }
  .item .qty { color: #00C9B1; font-size: 20px; font-weight: bold; }
  .item .del { background: none; border: none; color: #444; font-size: 16px; cursor: pointer; padding: 4px 8px; }

  .empty { text-align: center; padding: 40px; color: #444; font-size: 14px; }

  #manual { display: flex; gap: 8px; padding: 10px 16px 20px; border-top: 1px solid #2a2a2a; }
  #manual input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #f0f0ee; font-family: monospace; font-size: 14px; padding: 12px 14px; outline: none; }
  #manual button { background: #1a1a1a; border: 1px solid #00C9B1; border-radius: 10px; color: #00C9B1; padding: 12px 16px; font-weight: bold; cursor: pointer; }

  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #2a2a2a; }
  #topbar span { font-family: monospace; font-size: 11px; letter-spacing: 0.2em; color: #00C9B1; }
  #topbar button { background: none; border: 1px solid #2a2a2a; border-radius: 6px; color: #555; font-size: 10px; padding: 5px 10px; cursor: pointer; }
</style>
</head>
<body>

<div id="topbar">
  <span>PRFM · SCANNER</span>
  <button onclick="clearAll()">CLEAR ALL</button>
</div>

<div id="log">Tap START CAMERA to begin</div>

<div id="cam-wrap">
  <video id="video" playsinline autoplay muted></video>
</div>

<button id="scan-btn" onclick="handleBtn()">START CAMERA</button>

<div id="result">
  <div class="code" id="result-code"></div>
  <div class="btns">
    <button class="wrong" onclick="reject()">✕ WRONG</button>
    <button class="add"   onclick="confirm()">✓ ADD</button>
  </div>
</div>

<div id="tally"><div class="empty">No barcodes yet</div></div>

<div id="manual">
  <input id="m-input" type="text" inputmode="numeric" placeholder="Type barcode…" autocomplete="off" />
  <button onclick="manualAdd()">ADD</button>
</div>

<script>
  const tally = {};
  let stream = null;
  let detector = null;
  let cameraStarted = false;
  let pendingCode = null;
  let busy = false;

  function log(msg) {
    document.getElementById('log').textContent = msg;
  }

  async function handleBtn() {
    if (!cameraStarted) {
      await startCamera();
    } else {
      await doScan();
    }
  }

  async function startCamera() {
    const btn = document.getElementById('scan-btn');
    btn.disabled = true;
    log('Requesting camera permission…');

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });

      const video = document.getElementById('video');
      video.srcObject = stream;
      video.play();

      // Wait for video to be ready
      await new Promise((resolve) => {
        video.onloadedmetadata = resolve;
        setTimeout(resolve, 2000); // fallback
      });

      log('Camera ready — tap SCAN');

      // Check for BarcodeDetector
      if ('BarcodeDetector' in window) {
        detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'upc_e'] });
        log('Camera ready · BarcodeDetector available ✓');
      } else {
        log('Camera ready · BarcodeDetector NOT supported on this browser');
      }

      cameraStarted = true;
      btn.disabled = false;
      btn.textContent = '▦  TAP TO SCAN';

    } catch (err) {
      log('ERROR: ' + err.message);
      btn.disabled = false;
    }
  }

  async function doScan() {
    if (busy) return;
    busy = true;

    const btn = document.getElementById('scan-btn');
    btn.disabled = true;
    btn.textContent = 'READING…';

    const video = document.getElementById('video');

    if (!detector) {
      log('BarcodeDetector not supported. Use manual input or try Chrome on Android.');
      btn.disabled = false;
      btn.textContent = '▦  TAP TO SCAN';
      busy = false;
      return;
    }

    try {
      const codes = await detector.detect(video);

      if (codes.length === 0) {
        log('Nothing detected. Hold the barcode closer and tap again.');
      } else {
        const code = codes[0].rawValue;
        log('Detected: ' + code);

        if (!code.startsWith('8881400')) {
          log('Not a PRFM code: ' + code + ' — try again');
        } else {
          // Show confirm
          pendingCode = code;
          document.getElementById('result-code').textContent = code;
          document.getElementById('result').style.display = 'block';
          log('Confirm or reject below ↓');
          if (navigator.vibrate) navigator.vibrate([50, 40, 50]);
        }
      }
    } catch (err) {
      log('Scan error: ' + err.message);
    }

    btn.disabled = false;
    btn.textContent = '▦  TAP TO SCAN';
    busy = false;
  }

  function confirm() {
    if (!pendingCode) return;
    addToTally(pendingCode);
    pendingCode = null;
    document.getElementById('result').style.display = 'none';
    log('Added ✓ — tap to scan next');
  }

  function reject() {
    pendingCode = null;
    document.getElementById('result').style.display = 'none';
    log('Rejected — tap to scan again');
  }

  function addToTally(code) {
    const isNew = !tally[code];
    if (tally[code]) { tally[code].qty++; tally[code].scans++; }
    else { tally[code] = { qty: 1, scans: 1 }; }
    renderTally();
  }

  function renderTally() {
    const div = document.getElementById('tally');
    const codes = Object.keys(tally);
    if (!codes.length) { div.innerHTML = '<div class="empty">No barcodes yet</div>'; return; }
    div.innerHTML = codes.map(c =>
      `<div class="item">
        <div>
          <div>${c}</div>
          <div style="font-size:10px;color:#555;margin-top:3px">${tally[c].scans}× scanned</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="qty">${tally[c].qty}</div>
          <button class="del" onclick="removeItem('${c}')">✕</button>
        </div>
      </div>`
    ).join('');
  }

  function removeItem(code) {
    delete tally[code];
    renderTally();
  }

  function clearAll() {
    if (!Object.keys(tally).length) return;
    if (!confirm('Clear all?')) return;
    Object.keys(tally).forEach(k => delete tally[k]);
    renderTally();
    document.getElementById('result').style.display = 'none';
    pendingCode = null;
    log('Cleared');
  }

  document.getElementById('m-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualAdd();
  });

  function manualAdd() {
    const inp = document.getElementById('m-input');
    const code = inp.value.trim();
    if (!code) return;
    if (!code.startsWith('8881400')) { log('Not a PRFM barcode'); return; }
    addToTally(code);
    inp.value = '';
    log('Manually added: ' + code);
  }
</script>
</body>
</html>
