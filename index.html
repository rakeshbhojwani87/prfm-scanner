<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PRFM · Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap');
  :root {
    --bg: #0F0F0F; --surface: #1A1A1A; --border: #2A2A2A;
    --teal: #00C9B1; --red: #E63946; --chalk: #F0F0EE;
    --muted: #555; --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--chalk); font-family: var(--sans); overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-brand { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--teal); }
  .clear-btn { font-family: var(--mono); font-size: 10px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

  /* CAMERA */
  #cam-wrap { position: relative; width: 100%; height: 220px; background: #000; flex-shrink: 0; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #snap-canvas { display: none; }

  /* Frame corners */
  .frame-box {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
  }
  .frame-inner { width: 260px; height: 100px; position: relative; }
  .frame-inner::before, .frame-inner::after, .frame-inner .c1, .frame-inner .c2 {
    content: ''; position: absolute; width: 20px; height: 20px; border-color: var(--teal); border-style: solid;
  }
  .frame-inner::before { top:0; left:0; border-width: 3px 0 0 3px; }
  .frame-inner::after  { top:0; right:0; border-width: 3px 3px 0 0; }
  .frame-inner .c1     { bottom:0; right:0; border-width: 0 3px 3px 0; }
  .frame-inner .c2     { bottom:0; left:0; border-width: 0 0 3px 3px; }
  .scan-line {
    position: absolute; left: 4px; right: 4px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
    animation: sweep 1.8s ease-in-out infinite;
  }
  @keyframes sweep { 0%{top:5%;opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{top:95%;opacity:0} }

  /* Dark mask outside frame */
  .mask-top    { position: absolute; top: 0; left: 0; right: 0; height: calc(50% - 50px); background: rgba(0,0,0,0.6); }
  .mask-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: calc(50% - 50px); background: rgba(0,0,0,0.6); }
  .mask-left   { position: absolute; top: calc(50% - 50px); bottom: calc(50% - 50px); left: 0; width: calc(50% - 130px); background: rgba(0,0,0,0.6); }
  .mask-right  { position: absolute; top: calc(50% - 50px); bottom: calc(50% - 50px); right: 0; width: calc(50% - 130px); background: rgba(0,0,0,0.6); }

  /* Cam idle */
  #cam-idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #080808; z-index: 10; }
  .cam-hint { font-size: 12px; color: var(--muted); text-align: center; }
  .start-cam-btn { background: var(--teal); color: #0F0F0F; border: none; border-radius: 50px; padding: 14px 32px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; cursor: pointer; }

  /* Loading state */
  #cam-loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #080808; z-index: 9; }
  #cam-loading.show { display: flex; }
  .loading-text { font-family: var(--mono); font-size: 12px; color: var(--teal); letter-spacing: 0.15em; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Flash */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #flash.on { opacity: 0.5; transition: opacity 0s; }
  #flash.off { opacity: 0; transition: opacity 0.15s; }

  /* SCAN BUTTON */
  #scan-btn-wrap { padding: 12px 16px 8px; flex-shrink: 0; display: none; }
  #scan-btn {
    width: 100%; background: var(--teal); color: #0F0F0F; border: none; border-radius: 14px;
    padding: 18px; font-family: var(--mono); font-size: 15px; font-weight: 700;
    letter-spacing: 0.14em; cursor: pointer; transition: opacity 0.15s;
  }
  #scan-btn:active { opacity: 0.8; }
  #scan-btn:disabled { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

  /* CONFIRM BAR */
  #confirm-bar { background: #071A18; border-bottom: 2px solid var(--teal); padding: 16px; flex-shrink: 0; display: none; }
  #confirm-bar.show { display: block; animation: drop 0.2s ease; }
  @keyframes drop { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .confirm-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; color: var(--teal); margin-bottom: 6px; text-transform: uppercase; }
  .confirm-code  { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--chalk); margin-bottom: 14px; word-break: break-all; }
  .confirm-btns  { display: flex; gap: 10px; }
  .btn-wrong { flex: 1; background: none; border: 1.5px solid var(--red); border-radius: 10px; color: var(--red); font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 14px; cursor: pointer; }
  .btn-add   { flex: 2; background: var(--teal); border: none; border-radius: 10px; color: #0F0F0F; font-family: var(--mono); font-size: 14px; font-weight: 700; padding: 14px; cursor: pointer; }

  /* BAD BAR */
  #bad-bar { background: #1A0A0B; border-bottom: 2px solid var(--red); padding: 14px 16px; flex-shrink: 0; display: none; text-align: center; }
  #bad-bar.show { display: block; }
  .bad-text { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
  .btn-ok { background: none; border: 1.5px solid var(--teal); border-radius: 8px; color: var(--teal); font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 10px 24px; cursor: pointer; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px 14px; flex-shrink: 0; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat-val { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--teal); line-height: 1; }
  .stat-lbl { font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  /* TALLY */
  .tally-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 4px; flex-shrink: 0; }
  .tally-title { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
  .export-btn { font-family: var(--mono); font-size: 9px; color: var(--teal); background: none; border: 1px solid rgba(0,201,177,0.3); border-radius: 5px; padding: 4px 8px; cursor: pointer; }

  .tally-list { flex: 1; overflow-y: auto; padding: 4px 14px 10px; -webkit-overflow-scrolling: touch; }
  .tally-list::-webkit-scrollbar { display: none; }
  .tally-empty { text-align: center; padding: 28px 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
  .tally-empty span { font-size: 26px; display: block; margin-bottom: 8px; }

  .tally-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; animation: item-in 0.2s ease; }
  @keyframes item-in { from { transform: translateX(10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .tally-item.bump { animation: bump 0.3s ease; }
  @keyframes bump { 0% { background: rgba(0,201,177,0.15); } 100% { background: var(--surface); } }
  .tally-barcode { font-family: var(--mono); font-size: 13px; color: var(--chalk); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tally-scans { font-family: var(--mono); font-size: 10px; color: var(--muted); background: rgba(255,255,255,0.04); border-radius: 4px; padding: 2px 6px; flex-shrink: 0; }
  .tally-qty { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--teal); min-width: 32px; text-align: right; flex-shrink: 0; }
  .del-btn { color: #333; background: none; border: none; font-size: 15px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
  .del-btn:active { color: var(--red); }

  /* MANUAL */
  .manual-bar { display: flex; gap: 8px; padding: 8px 14px 18px; flex-shrink: 0; border-top: 1px solid var(--border); }
  .manual-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--chalk); font-family: var(--mono); font-size: 13px; padding: 11px 14px; outline: none; -webkit-appearance: none; }
  .manual-input:focus { border-color: var(--teal); }
  .manual-input::placeholder { color: #333; font-size: 12px; }
  .add-btn { background: var(--surface); color: var(--teal); border: 1px solid var(--teal); border-radius: 10px; padding: 11px 16px; font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  /* EXPORT */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal-sheet { background: #1A1A1A; border: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 28px 24px 40px; width: 100%; animation: sheet-up 0.3s cubic-bezier(0.4,0,0.2,1); }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; color: var(--teal); margin-bottom: 16px; }
  .export-textarea { width: 100%; background: #0F0F0F; border: 1px solid var(--border); border-radius: 10px; color: var(--chalk); font-family: var(--mono); font-size: 12px; padding: 14px; height: 200px; resize: none; outline: none; line-height: 1.7; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-close { background: none; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-family: var(--mono); font-size: 12px; padding: 13px 18px; cursor: pointer; }
  .modal-copy { flex: 1; background: var(--teal); border: none; border-radius: 10px; color: #0F0F0F; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 13px; cursor: pointer; }

  /* TOAST */
  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(50px); background: var(--surface); border: 1px solid var(--teal); border-radius: 8px; padding: 10px 18px; font-family: var(--mono); font-size: 11px; color: var(--teal); z-index: 200; transition: transform 0.25s ease; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err  { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">PRFM · SCANNER</div>
  <button class="clear-btn" onclick="clearAll()">CLEAR ALL</button>
</div>

<div id="cam-wrap">
  <div id="cam-idle">
    <div class="cam-hint">Aim at ONE barcode, then tap Scan</div>
    <button class="start-cam-btn" onclick="startCamera()">START CAMERA</button>
  </div>
  <div id="cam-loading"><div class="loading-text">STARTING CAMERA…</div></div>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="snap-canvas"></canvas>
  <!-- Mask -->
  <div class="mask-top"></div>
  <div class="mask-bottom"></div>
  <div class="mask-left"></div>
  <div class="mask-right"></div>
  <!-- Frame -->
  <div class="frame-box">
    <div class="frame-inner">
      <div class="c1"></div><div class="c2"></div>
      <div class="scan-line"></div>
    </div>
  </div>
  <div id="flash"></div>
</div>

<div id="scan-btn-wrap">
  <button id="scan-btn" onclick="captureAndDecode()">▦ &nbsp; TAP TO SCAN</button>
</div>

<div id="confirm-bar">
  <div class="confirm-label">▦ Barcode detected — confirm to add</div>
  <div class="confirm-code" id="confirm-code">—</div>
  <div class="confirm-btns">
    <button class="btn-wrong" onclick="rejectScan()">✕ WRONG</button>
    <button class="btn-add"   onclick="confirmScan()">✓ ADD TO TALLY</button>
  </div>
</div>

<div id="bad-bar">
  <div class="bad-text" id="bad-text">Not a PRFM barcode. Try again.</div>
  <button class="btn-ok" onclick="dismissBad()">TRY AGAIN</button>
</div>

<div class="stats-row">
  <div class="stat-card"><div class="stat-val" id="s-confirmed">0</div><div class="stat-lbl">Confirmed</div></div>
  <div class="stat-card"><div class="stat-val" id="s-skus">0</div><div class="stat-lbl">SKUs</div></div>
  <div class="stat-card"><div class="stat-val" id="s-units">0</div><div class="stat-lbl">Units</div></div>
</div>

<div class="tally-header">
  <div class="tally-title">Confirmed Tally</div>
  <button class="export-btn" onclick="openExport()">EXPORT ↗</button>
</div>

<div class="tally-list" id="tally-list">
  <div class="tally-empty"><span>▦</span>No barcodes confirmed yet.</div>
</div>

<div class="manual-bar">
  <input class="manual-input" id="manual-input" type="text" inputmode="numeric"
    placeholder="Type barcode manually…" autocomplete="off" autocapitalize="none"/>
  <button class="add-btn" onclick="manualAdd()">ADD</button>
</div>

<div class="modal-bg" id="export-modal">
  <div class="modal-sheet">
    <div class="modal-title">EXPORT · BARCODE TALLY</div>
    <textarea class="export-textarea" id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="modal-close" onclick="closeExport()">CLOSE</button>
      <button class="modal-copy"  onclick="copyExport()">COPY TO CLIPBOARD</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- BarcodeDetector API + fallback via dynamically loaded ZXing -->
<script>
// ── PRFM filter ──
function isPRFM(code) {
  return typeof code === 'string' && code.startsWith('8881400');
}

// ── STATE ──
const tally = {};
let totalConfirmed = 0;
let pendingCode = null;
let stream = null;
let detector = null;
let scanBusy = false;

// ── START CAMERA (just preview) ──
async function startCamera() {
  document.getElementById('cam-idle').style.display = 'none';
  document.getElementById('cam-loading').classList.add('show');

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();

    // Init BarcodeDetector if available (Chrome Android)
    if ('BarcodeDetector' in window) {
      detector = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'upc_e']
      });
    }

    document.getElementById('cam-loading').classList.remove('show');
    document.getElementById('scan-btn-wrap').style.display = 'block';

  } catch(e) {
    document.getElementById('cam-loading').classList.remove('show');
    document.getElementById('cam-idle').style.display = 'flex';
    document.getElementById('cam-idle').innerHTML =
      '<div style="color:#E63946;font-family:monospace;font-size:12px;text-align:center;padding:0 20px">Camera error:<br>' + e.message + '</div>';
    toast('Camera failed — use manual input below', true);
  }
}

// ── TAP TO SCAN — snapshot + decode ──
async function captureAndDecode() {
  if (scanBusy) return;
  scanBusy = true;

  const btn   = document.getElementById('scan-btn');
  const video = document.getElementById('video');
  btn.disabled = true;
  btn.textContent = 'READING…';

  // Flash
  const fl = document.getElementById('flash');
  fl.classList.add('on');
  setTimeout(() => fl.classList.remove('on'), 120);

  // Snap frame to canvas
  const canvas = document.getElementById('snap-canvas');
  canvas.width  = video.videoWidth  || 1280;
  canvas.height = video.videoHeight || 720;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Crop centre zone only (where the frame box is)
  const cropW = Math.round(canvas.width  * 0.65);
  const cropH = Math.round(canvas.height * 0.55);
  const cropX = Math.round((canvas.width  - cropW) / 2);
  const cropY = Math.round((canvas.height - cropH) / 2);
  const crop  = document.createElement('canvas');
  crop.width  = cropW;
  crop.height = cropH;
  crop.getContext('2d').drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

  let found = null;

  try {
    if (detector) {
      // Native BarcodeDetector (Chrome Android — best results)
      const results = await detector.detect(crop);
      if (results.length > 0) found = results[0].rawValue;
    } else {
      // Fallback: ZXing loaded dynamically
      found = await decodeWithZXing(crop);
    }
  } catch(e) {
    found = null;
  }

  btn.disabled = false;
  btn.textContent = '▦  TAP TO SCAN';

  handleResult(found);
  scanBusy = false;
}

// ── ZXing dynamic fallback ──
function decodeWithZXing(canvas) {
  return new Promise((resolve) => {
    // Load ZXing only once
    if (window._zxingLoaded) {
      tryZXing(canvas, resolve);
      return;
    }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/zxing/0.19.1/zxing.min.js';
    s.onload = () => { window._zxingLoaded = true; tryZXing(canvas, resolve); };
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

function tryZXing(canvas, resolve) {
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.UPC_A,
    ]);
    const reader = new ZXing.BrowserMultiFormatReader(hints);
    reader.decodeFromCanvas(canvas)
      .then(r => resolve(r ? r.getText() : null))
      .catch(() => resolve(null));
  } catch(e) {
    resolve(null);
  }
}

// ── HANDLE RESULT ──
function handleResult(code) {
  document.getElementById('confirm-bar').classList.remove('show');
  document.getElementById('bad-bar').classList.remove('show');

  if (!code) {
    // Nothing found
    document.getElementById('bad-text').textContent =
      'No barcode found. Hold the label steady inside the frame and tap again.';
    document.getElementById('bad-bar').classList.add('show');
    if (navigator.vibrate) navigator.vibrate(200);
    return;
  }

  if (!isPRFM(code)) {
    // Found something but not PRFM
    document.getElementById('bad-text').textContent =
      'Wrong barcode read: ' + code + '\nAim at a PRFM label (starts with 8881400).';
    document.getElementById('bad-bar').classList.add('show');
    if (navigator.vibrate) navigator.vibrate(200);
    return;
  }

  // Valid PRFM code
  pendingCode = code;
  document.getElementById('confirm-code').textContent = code;
  document.getElementById('confirm-bar').classList.add('show');
  if (navigator.vibrate) navigator.vibrate([50, 40, 50]);
}

// ── CONFIRM / REJECT ──
function confirmScan() {
  if (!pendingCode) return;
  recordBarcode(pendingCode);
  pendingCode = null;
  document.getElementById('confirm-bar').classList.remove('show');
}

function rejectScan() {
  pendingCode = null;
  document.getElementById('confirm-bar').classList.remove('show');
  toast('Rejected — try again', true);
}

function dismissBad() {
  document.getElementById('bad-bar').classList.remove('show');
}

// ── RECORD ──
function recordBarcode(code) {
  const isNew = !tally[code];
  if (tally[code]) { tally[code].qty += 1; tally[code].scans += 1; }
  else { tally[code] = { qty: 1, scans: 1 }; }
  totalConfirmed += 1;
  updateStats();
  updateTallyList(code, isNew);
  toast('✓ Added: ' + code);
}

function updateStats() {
  const barcodes = Object.keys(tally);
  const units = barcodes.reduce((s, b) => s + tally[b].qty, 0);
  document.getElementById('s-confirmed').textContent = totalConfirmed;
  document.getElementById('s-skus').textContent      = barcodes.length;
  document.getElementById('s-units').textContent     = units;
}

function updateTallyList(code, isNew) {
  const list  = document.getElementById('tally-list');
  const empty = list.querySelector('.tally-empty');
  if (empty) empty.remove();
  const id = 'bc_' + code;
  if (isNew) {
    const div = document.createElement('div');
    div.className = 'tally-item'; div.id = id;
    div.innerHTML = itemHTML(code);
    list.insertBefore(div, list.firstChild);
  } else {
    const el = document.getElementById(id);
    if (el) { el.innerHTML = itemHTML(code); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
}

function itemHTML(code) {
  return `<div class="tally-barcode">${code}</div>
    <div class="tally-scans">${tally[code].scans}×</div>
    <div class="tally-qty">${tally[code].qty}</div>
    <button class="del-btn" onclick="removeItem('${code}')">✕</button>`;
}

function removeItem(code) {
  delete tally[code];
  const el = document.getElementById('bc_' + code);
  if (el) el.remove();
  updateStats();
  if (!Object.keys(tally).length)
    document.getElementById('tally-list').innerHTML = '<div class="tally-empty"><span>▦</span>No barcodes confirmed yet.</div>';
}

function clearAll() {
  if (!Object.keys(tally).length) return;
  if (!confirm('Clear all confirmed barcodes?')) return;
  Object.keys(tally).forEach(k => delete tally[k]);
  totalConfirmed = 0;
  document.getElementById('tally-list').innerHTML = '<div class="tally-empty"><span>▦</span>No barcodes confirmed yet.</div>';
  document.getElementById('confirm-bar').classList.remove('show');
  document.getElementById('bad-bar').classList.remove('show');
  pendingCode = null;
  updateStats();
}

// ── MANUAL ──
document.getElementById('manual-input').addEventListener('keydown', e => { if (e.key === 'Enter') manualAdd(); });
function manualAdd() {
  const inp = document.getElementById('manual-input');
  const code = inp.value.trim();
  if (!code) return;
  if (!isPRFM(code)) { toast('Must start with 8881400', true); return; }
  recordBarcode(code);
  inp.value = ''; inp.blur();
}

// ── EXPORT ──
function openExport() {
  const barcodes = Object.keys(tally);
  if (!barcodes.length) { toast('Nothing to export yet', true); return; }
  const now = new Date().toLocaleString();
  let text = `PRFM INVENTORY SCAN\n${now}\n${'─'.repeat(36)}\nBARCODE            QTY  SCANS\n${'─'.repeat(36)}\n`;
  barcodes.forEach(bc => { text += `${bc}   ${String(tally[bc].qty).padStart(3)}  ${tally[bc].scans}×\n`; });
  const total = barcodes.reduce((s, b) => s + tally[b].qty, 0);
  text += `${'─'.repeat(36)}\nSKUs: ${barcodes.length}   UNITS: ${total}\n`;
  document.getElementById('export-text').value = text;
  document.getElementById('export-modal').classList.add('open');
}
function closeExport() { document.getElementById('export-modal').classList.remove('open'); }
function copyExport() {
  const ta = document.getElementById('export-text');
  navigator.clipboard.writeText(ta.value).then(() => toast('Copied ✓')).catch(() => { ta.select(); document.execCommand('copy'); toast('Copied ✓'); });
  closeExport();
}

// ── TOAST ──
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 2800);
}
</script>
